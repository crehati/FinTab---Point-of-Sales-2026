<style>
  :root { font-size: 16px; }
  * { font-family: 'Inter', sans-serif !important; box-sizing: border-box; }
  
  /* ROOT LAYOUT - PREVENT BODY SCROLL FOR DESKTOP APP FEEL */
  html, body { 
    height: 100vh; 
    width: 100vw; 
    overflow: hidden; 
    margin: 0; 
    padding: 0;
    background-color: #f8fafc;
    color: #1e293b;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #root { height: 100%; width: 100%; }

  /* LIQUID SCROLLBARS - MINIMALIST FINTECH STYLE */
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 10px;
  }
  .dark ::-webkit-scrollbar-thumb {
    background: #1e293b;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #cbd5e1;
  }

  /* ELEGANT INPUT PROTOCOL */
  input, select, textarea {
    background-color: #F8FAFC; 
    border: none;
    border-radius: 1rem;
    padding: 1rem 1.2rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: #1E293B;
    width: 100%;
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none !important;
    background-color: #ffffff !important;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
  }

  /* ELEGANT BUTTON SYSTEM */
  .btn-base {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 1rem;
    padding: 1rem 2rem;
    font-size: 0.75rem;
    border: none;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-primary { background-color: #2563EB; color: white; box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.2); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25); }
  
  .custom-scrollbar {
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* MOBILE-ONLY TWEAKS */
  @media (max-width: 1024px) {
    .sidebar-mobile-overlay {
       background: rgba(15, 23, 42, 0.5);
       backdrop-filter: blur(4px);
    }
  }
</style>
