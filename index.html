<style>
  :root { font-size: 16px; }
  * { font-family: 'Inter', sans-serif !important; box-sizing: border-box; }
  body { overscroll-behavior-y: none; background-color: #f8fafc; color: #1e293b; line-height: 1.6; }

  /* ELEGANT INPUT PROTOCOL */
  input, select, textarea {
    background-color: #F8FAFC !important; 
    border: none !important;
    border-radius: 1.25rem !important;
    padding: 1.1rem 1.4rem !important;
    font-size: 0.9rem !important;
    font-weight: 500 !important; /* Elegant medium weight */
    color: #1E293B !important;
    width: 100%;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Specific placeholder styling */
  input::placeholder, textarea::placeholder {
    font-weight: 400 !important;
    color: #94A3B8 !important;
  }

  .dark input, .dark select, .dark textarea {
    background-color: #0F172A !important;
    color: #F1F5F9 !important;
  }
  input:focus, select:focus, textarea:focus {
    outline: none !important;
    background-color: #ffffff !important;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1) !important;
  }
  .dark input:focus { background-color: #1E293B !important; }

  /* ELEGANT BUTTON SYSTEM */
  .btn-base {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700; /* Bold but not heavy */
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-radius: 9999px;
    padding: 1.2rem 2.2rem;
    font-size: 0.72rem;
    border: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-primary { background-color: #2563EB; color: white; shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.4); }
  .btn-primary:hover { transform: translateY(-1px); shadow: 0 12px 25px -6px rgba(37, 99, 235, 0.5); }
  
  .btn-secondary { background-color: #F1F5F9; color: #475569; }
  .dark .btn-secondary { background-color: #1E293B; color: #94A3B8; }

  /* TYPOGRAPHY UTILS */
  .label-protocol {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #94A3B8;
  }

  .no-scroll { overflow: hidden !important; }
